# Cluster-internal, for `kubectl port-forward svc/consigliere 8080` and the optional tailnet-only Ingress in
# deploy/k8s/tailscale. Nothing is exposed to the internet.
apiVersion: v1
kind: Service
metadata:
  name: consigliere
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: consigliere
  ports:
    - name: http
      port: 8080
      targetPort: http
