# The disk holding the data pack clone and the database. The default storage classes delete the disk with its
# claim; this one keeps it, so deleting the namespace by mistake doesn't take the database with it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: consigliere-retain
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_LRS
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: consigliere-data
spec:
  storageClassName: consigliere-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
