# The dashboard on the owner's tailnet at https://consigliere.<tailnet>.ts.net, with a certificate from Tailscale.
# Only devices on the tailnet can reach it (this is not Funnel), and the dashboard's own sign-in still applies.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: consigliere
  namespace: consigliere
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: consigliere
      port:
        number: 8080
  tls:
    - hosts: [consigliere]
