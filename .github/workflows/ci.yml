name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...
      - run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dashboard (type-check, test, build into internal/web/dist)
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build (static linux binary with the dashboard embedded, as the container will run it)
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "-s -w" -o bin/consigliere ./cmd/consigliere

  # The deployment files, checked on every push so a broken one shows up here rather than mid-deploy.
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep (compile and lint)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Kubernetes manifests (render with example values)
        run: |
          cp deploy/k8s/azure.env.example deploy/k8s/azure.env
          kubectl kustomize deploy/k8s > /dev/null

      - name: Shell scripts
        run: shellcheck deploy/*.sh deploy/k8s/datapack-sync.sh

      - name: Container image
        run: docker build -t consigliere:ci .
