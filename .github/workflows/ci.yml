name: ci

on:
  push:
    branches: [main, alison/main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...
      - run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dashboard (type-check, test, build into internal/web/dist)
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Release (the Arm64 Linux binary with the dashboard embedded, packaged as the VMs install it)
        run: bash deploy/package.sh dist/consigliere.tar.gz

  # The deployment files, checked on every push so a broken one shows up here rather than mid-deploy.
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep (compile and lint, and both bots' parameters)
        env:
          CONSIGLIERE_OWNER_OBJECT_ID: 00000000-0000-0000-0000-000000000000
          CONSIGLIERE_BUDGET_EMAIL: ci@example.com
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for p in infra/*.bicepparam; do az bicep build-params --file "$p" --stdout > /dev/null; done

      - name: Shell scripts
        run: shellcheck -x deploy/*.sh deploy/vm/*.sh

      - name: systemd units
        run: |
          # verify wants the binaries the units start; empty stand-ins are enough to check the unit files themselves.
          sudo mkdir -p /opt/consigliere/current/deploy/vm
          sudo touch /opt/consigliere/current/consigliere /opt/consigliere/current/deploy/vm/datapack-sync.sh
          sudo chmod +x /opt/consigliere/current/consigliere /opt/consigliere/current/deploy/vm/datapack-sync.sh
          sudo useradd --system consigliere
          systemd-analyze verify deploy/vm/*.service deploy/vm/*.timer

      - name: Container image
        run: docker build -t consigliere:ci .
